[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "behive"
version = "0.2.0"
description = "Research engine that builds structured knowledge graphs from any topic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "QA10", email = "hello@qa10.io"}
]
keywords = ["research", "knowledge-graph", "ai", "mcp", "deep-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiohttp>=3.9",
    "boto3>=1.28",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
mcp = ["fastmcp>=3.0"]
api = ["fastapi>=0.100", "uvicorn>=0.20"]
qdrant = ["qdrant-client>=1.7", "sentence-transformers>=2.2"]
all = ["behive[mcp,api,qdrant]"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
behive = "behive.cli:main"

[project.urls]
Homepage = "https://github.com/qa10devteam/behive"
Documentation = "https://behive.dev"
Repository = "https://github.com/qa10devteam/behive"



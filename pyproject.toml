[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "behive"
version = "0.3.0"
description = "Research engine that builds structured knowledge graphs from any topic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "QA10", email = "hello@qa10.io"}
]
keywords = ["research", "knowledge-graph", "ai", "mcp", "deep-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.25",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "litellm>=1.40",
    "feedparser>=6.0",
]

[project.optional-dependencies]
stealth = [
    "curl-cffi>=0.7",
    "primp>=0.13",
    "nodriver>=0.38",
    "patchright>=0.5",
]
harvest = [
    "trafilatura>=1.6",
    "newspaper4k>=0.9",
    "langdetect>=1.0",
    "markitdown>=0.1",
    "PyMuPDF>=1.23",
    "crawl4ai>=0.3",
]
process = [
    "rapidfuzz>=3.5",
    "spacy>=3.7",
    "litellm>=1.30",
    "tiktoken>=0.5",
]
science = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]
mcp = ["fastmcp>=3.0"]
api = ["fastapi>=0.100", "uvicorn>=0.20"]
qdrant = ["qdrant-client>=1.7", "sentence-transformers>=2.2"]
all = ["behive[stealth,harvest,process,science,mcp,api]"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.3"]

[project.scripts]
behive = "behive.cli:main"

[project.urls]
Homepage = "https://github.com/qa10devteam/behive"
Documentation = "https://behive.dev"
Repository = "https://github.com/qa10devteam/behive"



name: CI

# GitHub-hosted runners only (free for this public repository, ruling R-12). Never add a
# self-hosted runner: on the BeHive host the local PostgreSQL is production. The test job runs
# in a container next to its own throwaway PostgreSQL service on the job network
# (host "postgres", no host port mapping), so nothing here can reach a database on the runner.

on:
  push:
    branches: [main, "pm/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ --select F821,F811,F601  # blocking: clean since diag 2026-11-12 (2883efb)

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    container: python:${{ matrix.python-version }}-slim

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: behive
          POSTGRES_PASSWORD: behive_test
          POSTGRES_DB: behive_test
        options: >-
          --health-cmd "pg_isready -U behive -d behive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Throwaway service database on the job network (host "postgres"); not a secret.
      BEHIVE_DB_URL: postgresql://behive:behive_test@postgres:5432/behive_test
      HIVE_PG_HOST: postgres
      HIVE_PG_PORT: "5432"
      HIVE_PG_USER: behive
      HIVE_PG_PASSWORD: behive_test
      HIVE_PG_DATABASE: behive_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]" pytest-timeout openpyxl

      - name: Initialize test database
        run: behive db init

      # The step name is pinned by tests/test_diag1112_test_infra.py (it reads this step's env);
      # the suite is run exactly as the PM harness runs it, without a coverage plugin.
      - name: Run tests with coverage
        env:
          # tests/conftest.py refuses to start without explicit consent (BEHIVE_TEST_DB=1) and
          # takes its target from BEHIVE_TEST_PG_DSN: the CI service database behive_test.
          BEHIVE_TEST_DB: "1"
          BEHIVE_TEST_PG_DSN: host=postgres port=5432 dbname=behive_test user=behive password=behive_test
        run: python -m pytest tests -o addopts="" -q --tb=short -rfE -p no:cacheprovider --timeout=120

      - name: Verify CLI works
        run: |
          behive version
          behive --help

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Fresh install smoke test
        run: |
          pip install .
          behive version
          behive --help
          python -c "from behive import __version__; print(f'v{__version__}')"
          python -c "from behive.engine import orchestrator; print('engine OK')"
